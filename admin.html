<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="./style.css?v=7"><style>
:root{--blue:#2563eb;--ink:#13233d;--muted:#6b7c94;--line:#e4eaf3;--bg:#f4f7fc}body{background:var(--bg)!important;color:var(--ink)!important;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif!important}body .top{background:#fff!important;border-bottom:1px solid var(--line)!important;box-shadow:none!important}body .top .brand{color:#1744a2!important;font-weight:800!important}body .top a{color:#314b73!important}body .pagehead{background:transparent!important;color:var(--ink)!important;padding:30px 0 10px!important}body .pagehead h1{color:var(--ink)!important;font-size:clamp(24px,4vw,34px)!important;letter-spacing:-.6px}body .pagehead p{color:var(--muted)!important}body .section{padding-top:12px!important}body .wrap{max-width:1220px!important}#adminSummary{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px!important;margin-bottom:20px}#adminSummary>*{background:#fff!important;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:0 4px 20px #203b6810!important;padding:20px!important;color:var(--ink)!important}body .card{background:#fff!important;border:1px solid var(--line)!important;border-radius:18px!important;box-shadow:0 5px 22px #243f6910!important;padding:clamp(18px,3vw,28px)!important}body .card h2{font-size:22px!important;color:var(--ink)!important}body .subtitle{color:var(--muted)!important}body table{width:100%;border-collapse:collapse}body th{text-align:left;background:#f7f9fe!important;color:#526780!important;font-size:12px!important;text-transform:uppercase;letter-spacing:.06em;padding:15px!important;white-space:nowrap}body td{padding:16px!important;border-bottom:1px solid #edf1f7!important;color:var(--ink)!important;vertical-align:middle}body tr:hover td{background:#f8faff!important}body button,body .btn{border-radius:10px!important}body .btn{background:var(--blue)!important;color:white!important;border:1px solid var(--blue)!important;font-weight:650!important}body .field label{font-weight:650!important;color:#425775!important}body input,body select,body textarea{border:1px solid #d9e2f0!important;border-radius:10px!important;background:white!important;color:var(--ink)!important;min-height:44px}body input:focus,body select:focus,body textarea:focus{outline:2px solid #bfdbfe!important;border-color:var(--blue)!important}#bookingManager{scroll-margin-top:18px}#bookingInfo{background:#f7faff!important;border:1px solid #e3ecff!important;border-radius:12px!important;padding:16px!important;margin:12px 0 20px!important}.admin-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.admin-tag{font-size:12px;font-weight:750;background:#eaf2ff;color:#1d4ed8;border-radius:99px;padding:8px 12px}.admin-help{font-size:13px;color:var(--muted)}.admin-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}.admin-quicklinks{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 6px}.admin-quicklinks a{padding:9px 12px;border:1px solid #dbe5f5;border-radius:9px;text-decoration:none;background:#fff;color:#2a559d;font-weight:650;font-size:13px}@media(max-width:680px){body .pagehead{padding:20px 0 6px!important}#adminSummary{grid-template-columns:repeat(2,minmax(0,1fr))!important}#adminSummary>*{padding:14px!important}body .card{padding:16px!important}body th,body td{padding:12px!important}body .formgrid{grid-template-columns:1fr!important}.admin-toolbar{align-items:flex-start}}
</style></head><body>
<header class="top"><div class="wrap nav"><div class="brand">Transport Admin</div><nav class="navlinks"><a href="./index.html">Website</a><a href="#" id="logout">Logout</a></nav></div></header>
<div class="pagehead"><div class="wrap"><h1>Booking Management</h1><p>Manage trips, customer requests and payments in one place.</p></div></div>
<main class="section"><div class="wrap">
<div class="admin-quicklinks"><a href="./index.html">↗ Open Website</a><a href="#bookingsPanel">↓ View Bookings</a></div><div id="adminSummary" class="dashboard"></div>
<div id="bookingsPanel" class="card" style="margin-top:18px"><div class="admin-toolbar"><div><h2>All Bookings</h2><p class="subtitle">Select Manage to review and update a booking.</p></div><span class="admin-tag">LIVE BOOKINGS</span></div><div class="admin-table-wrap"><table><thead><tr><th>Reference</th><th>Customer</th><th>Route</th><th>Status</th><th>Price</th><th></th></tr></thead><tbody id="adminRows"></tbody></table></div></div>
<div id="bookingManager" class="card" style="margin-top:18px;display:none">
<div class="admin-toolbar"><h2 id="manageTitle">Manage Booking</h2><span class="admin-tag">BOOKING DETAILS</span></div>
<div id="bookingInfo" class="booking-info"></div>
<form id="manageForm" class="formgrid">
<input id="manageId" type="hidden">
<div class="field"><label>Status / Action</label><select id="manageAction"><option value="quote">Quote</option><option value="accept">Accept</option><option value="confirm">Confirm</option><option value="reschedule">Reschedule</option><option value="start">Start Trip</option><option value="complete">Complete</option><option value="reject">Reject</option><option value="cancel">Cancel</option></select></div>
<div class="field"><label>Price (AED)</label><input id="managePrice" type="number" min="0" step="0.01"></div>
<div class="field"><label>Pickup date & time</label><input id="managePickup" type="datetime-local"></div>
<div class="field"><label>End date & time — Admin only</label><input id="manageEnd" type="datetime-local"></div>
<div class="field full"><label>Admin comment</label><textarea id="manageComment"></textarea></div>
<div class="field full"><label>Payment link</label><input id="managePaymentLink" type="url" placeholder="https://..."></div>
<div class="field full"><button class="btn" type="submit">Save Booking Update</button></div>
</form><div id="adminMessage" class="msg"></div></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./admin.js?v=7"></script></body></html>
