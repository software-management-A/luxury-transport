<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071525"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css?v=16"><title>New Booking • Luxury Transport Dubai</title></head><body><header class="top"><div class="wrap nav"><a class="brand" href="./index.html">Luxury Transport Dubai</a><a class="mini-btn" href="./index.html">Home</a></div></header><section class="pagehead"><div class="wrap"><div class="eyebrow">Luxury Transport Dubai</div><h1>New Booking</h1><p>Send your journey details. Price and availability are confirmed after review.</p></div></section><main class="section"><div class="wrap"><div class="card"><form id="bookingForm" class="formgrid">
<div class="field"><label>First name</label><input id="firstName" required></div><div class="field"><label>Last name</label><input id="lastName"></div><div class="field"><label>Mobile</label><input id="mobile" type="tel" required></div><div class="field"><label>WhatsApp</label><input id="whatsapp" type="tel"></div>
<div class="field"><label>Trip type</label><select id="tripType"><option value="single">Single trip</option><option value="return">Return trip</option><option value="tour">Tour</option><option value="custom">Custom</option></select></div><div class="field"><label>Passengers</label><input id="passengers" type="number" min="1" value="1" required></div>
<div class="field"><label>Pickup location name</label><input id="pickupLocation" placeholder="e.g. Dubai Mall" required></div><div class="field"><label>Pickup Google Maps link</label><input id="pickupMapLink" type="url" placeholder="https://maps.google.com/..." required></div><div class="field"><label>Drop-off location name</label><input id="dropoffLocation" placeholder="e.g. Dubai International Airport" required></div><div class="field"><label>Drop-off Google Maps link</label><input id="dropoffMapLink" type="url" placeholder="https://maps.google.com/..." required></div><div class="field full"><label>Pickup date &amp; time</label><input id="pickupTime" type="datetime-local" required></div><div class="field full"><label>Additional Stops (optional)</label><div id="extraStops"></div><button class="mini-btn" id="addStopBtn" type="button">+ Add Stop</button><p class="muted">Add intermediate stops in travel order. Final drop-off stays the destination above.</p></div><div class="field full"><label>Comment</label><textarea id="comment" placeholder="Flight number, luggage or other details"></textarea></div><div class="field full"><button class="btn" type="submit">Send Trip Request</button></div></form><div id="bookingMessage" class="msg"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./app.js?v=16"></script></body></html>
