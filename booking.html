<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071525"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.5/build/css/intlTelInput.css"><link rel="stylesheet" href="./style.css?v=25"><title>New Booking • Luxury Transport Dubai</title></head><body><header class="top"><div class="wrap nav"><a class="brand" href="./index.html">Luxury Transport Dubai</a><a class="mini-btn" href="./index.html">Home</a></div></header><section class="pagehead"><div class="wrap"><div class="eyebrow">Luxury Transport Dubai</div><h1>New Booking</h1><p>Search by place name or pin exact pickup, drop-off and optional stops on the map.</p></div></section><main class="section"><div class="wrap"><div class="card"><form id="bookingForm" class="formgrid">
<div class="field"><label>First name</label><input id="firstName" required></div><div class="field"><label>Last name</label><input id="lastName"></div><div class="field full"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label>Mobile</label><input id="mobile" type="tel" autocomplete="tel" required><small class="muted">Select country code, then enter the local mobile number.</small></div><div class="field"><label>WhatsApp</label><input id="whatsapp" type="tel" autocomplete="tel"><small class="muted">Optional. Country-specific number validation.</small></div><div class="field"><label>Trip type</label><select id="tripType"><option value="single">Single trip</option><option value="return">Return trip</option><option value="custom">Custom</option></select></div><div class="field"><label>Passengers</label><input id="passengers" type="number" min="1" value="1" required></div>
<div class="field full"><label>Pickup location</label><div class="location-box"><input id="pickupLocation" placeholder="Enter pickup location" autocomplete="off" required><input id="pickupMapLink" type="hidden"><input id="pickupLat" type="hidden"><input id="pickupLng" type="hidden"></div></div>
<div class="field full"><label>Drop-off location</label><div class="location-box"><input id="dropoffLocation" placeholder="Enter drop-off location" autocomplete="off" required><input id="dropoffMapLink" type="hidden"><input id="dropoffLat" type="hidden"><input id="dropoffLng" type="hidden"></div></div>
<div class="field full"><label>Pickup date &amp; time</label><input id="pickupTime" type="datetime-local" required></div><div class="field full"><label>Additional Stops (optional)</label><div id="extraStops"></div><button class="mini-btn" id="addStopBtn" type="button">+ Add Stop</button><p class="muted">Each stop can be pinned exactly on the map.</p></div><div class="field full"><label>Comment</label><textarea id="comment" placeholder="Flight number, luggage or other details"></textarea></div><div class="field full"><button class="btn" type="submit">Send Trip Request</button></div></form><div id="bookingMessage" class="msg"></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.5/build/js/intlTelInput.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./config.js"></script><script src="./location-picker.js?v=25"></script><script src="./app.js?v=25"></script><script>LocationPicker.bind({name:document.getElementById('pickupLocation'),lat:document.getElementById('pickupLat'),lng:document.getElementById('pickupLng'),link:document.getElementById('pickupMapLink')});LocationPicker.bind({name:document.getElementById('dropoffLocation'),lat:document.getElementById('dropoffLat'),lng:document.getElementById('dropoffLng'),link:document.getElementById('dropoffMapLink')});</script></body></html>
