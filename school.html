<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Recurring Schedule</title></head><body><div class="wrap"><div class="topbar"><h2>School / Recurring Schedule</h2><a class="btn secondary" href="index.html">Home</a></div><form id="scheduleForm" class="card form"><div class="row"><div class="field"><label>First name</label><input name="first_name" required></div><div class="field"><label>Last name</label><input name="last_name"></div></div><div class="row"><div class="field"><label>Mobile</label><input name="phone" required></div><div class="field"><label>WhatsApp</label><input name="whatsapp"></div></div><div class="field"><label>Passenger / Child name</label><input name="passenger_name"></div><div class="field"><label>School / Destination name</label><input name="school_name"></div><div class="field"><label>Pickup</label><input name="pickup" required></div><div class="field"><label>Drop-off</label><input name="dropoff" required></div><div class="row"><div class="field"><label>Start date</label><input type="date" name="start" required></div><div class="field"><label>End date</label><input type="date" name="end" required></div></div><div class="field"><label>Days</label><div><label><input type="checkbox" name="days" value="1"> Mon</label> <label><input type="checkbox" name="days" value="2"> Tue</label> <label><input type="checkbox" name="days" value="3"> Wed</label> <label><input type="checkbox" name="days" value="4"> Thu</label> <label><input type="checkbox" name="days" value="5"> Fri</label> <label><input type="checkbox" name="days" value="6"> Sat</label> <label><input type="checkbox" name="days" value="7"> Sun</label></div></div><div class="row"><div class="field"><label>Pickup time</label><input type="time" name="pickup_time" required></div><div class="field"><label>Duration minutes</label><input type="number" name="duration" value="60" min="1" required></div></div><div class="field"><label><input type="checkbox" id="hasReturn" name="has_return"> Return trip</label></div><div id="returnFields" class="hidden"><div class="field"><label>Return pickup</label><input name="return_pickup"></div><div class="field"><label>Return drop-off</label><input name="return_dropoff"></div><div class="field"><label>Return time</label><input type="time" name="return_time"></div></div><div class="field"><label>Comment</label><textarea name="comment"></textarea></div><button class="btn">Send Schedule Request</button><div id="scheduleMsg" class="msg"></div></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/school.js"></script></body></html>
