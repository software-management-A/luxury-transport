<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="./style.css?v=18"><title>School / Recurring Transport</title></head><body><header class="top"><div class="wrap nav"><a class="brand" href="./index.html">Luxury Transport Dubai</a><a class="mini-btn" href="./index.html">Home</a></div></header><section class="pagehead"><div class="wrap"><h1>School / Recurring Transport</h1><p>Create a weekly morning and afternoon schedule with multiple pickups and drops.</p></div></section><main class="section"><div class="wrap"><div class="card"><form id="scheduleForm" class="formgrid"><div class="field"><label>First name</label><input id="sfFirst" required></div><div class="field"><label>Last name</label><input id="sfLast"></div><div class="field"><label>Mobile</label><input id="sfPhone" type="tel" required></div><div class="field"><label>WhatsApp</label><input id="sfWhatsapp" type="tel"></div><div class="field"><label>Passenger / Student name</label><input id="sfPassenger" required></div><div class="field"><label>School / Destination</label><input id="sfSchool"></div><div class="field"><label>Start date</label><input id="sfStart" type="date" required></div><div class="field"><label>End date</label><input id="sfEnd" type="date"></div><div class="field full"><h3>Weekly Days & Times</h3><p class="muted">Enable any day. Morning and afternoon/return times can be different for each day.</p><div id="weekDays"></div></div><div class="field full"><h3>Morning Route</h3><div id="morningRoute"></div><button type="button" class="mini-btn" data-add-route="morning">+ Add Pickup / Drop</button></div><div class="field full"><h3>Afternoon / Return Route</h3><div id="afternoonRoute"></div><button type="button" class="mini-btn" data-add-route="afternoon">+ Add Pickup / Drop</button></div><div class="field full"><label>Notes</label><textarea id="sfComment"></textarea></div><div class="field full"><button class="btn" type="submit">Submit Weekly Schedule</button></div></form><div id="scheduleMessage" class="msg"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./config.js"></script><script src="./location-picker.js?v=18"></script><script src="./school.js?v=18"></script></body></html>
