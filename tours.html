<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="./style.css?v=19"><title>Tours & Tickets</title></head><body><header class="top"><div class="wrap nav"><a class="brand" href="./index.html">Luxury Transport Dubai</a><a class="mini-btn" href="./index.html">Home</a></div></header><section class="pagehead"><div class="wrap"><h1>Tours & Tickets</h1><p>Choose one or multiple attractions, see timings and ticket age rules, and book for your group.</p></div></section><main class="section"><div class="wrap"><div id="tourList" class="tour-grid"></div><div class="card" style="margin-top:18px"><h2>Your Tour Request</h2><form id="tourForm" class="formgrid"><div class="field"><label>First name</label><input id="tfFirst" required></div><div class="field"><label>Last name</label><input id="tfLast"></div><div class="field"><label>Mobile</label><input id="tfPhone" type="tel" required></div><div class="field"><label>WhatsApp</label><input id="tfWhatsapp" type="tel"></div><div class="field"><label>Visit date</label><input id="tfDate" type="date" required></div><div class="field full"><label class="day-toggle"><input id="tfTransport" type="checkbox"> I also need transport / pickup</label></div><div class="field full hidden" id="tfPickupBox"><label>Pickup location</label><input id="tfPickup" readonly placeholder="Search or pin pickup location"><input id="tfPickupLat" type="hidden"><input id="tfPickupLng" type="hidden"><input id="tfPickupLink" type="hidden"><button type="button" class="pin-btn" id="tfPickupPin">🔎 Search / 📍 Pin Pickup</button></div><div class="field full"><label>Notes / transport request</label><textarea id="tfNote" placeholder="Tell us if you also need transport, hotel pickup, special assistance, etc."></textarea></div><div class="field full"><div id="tourSelection"></div></div><div class="
